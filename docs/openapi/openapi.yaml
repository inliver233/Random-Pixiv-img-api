openapi: 3.1.0
info:
  title: Random Anime Image API (pixivcat-backend)
  version: 0.0.0
  description: |
    本 OpenAPI 文档用于描述本项目新增的随机图片 API 与管理端点：
      - /random（image/json/redirect）
      - /tags（标签检索）
      - /authors（作者检索）
      - /images（列表检索）
      - /images/:id（JSON 元信息）
      - /i/:id.:ext（稳定图片 URL 的流式代理）
      - /healthz
      - /metrics
      - /admin（AdminJS + 管理 API）

    说明：
    - legacy Pixivcat 兼容路由（/:illustId.:ext 与 /:illustId-:page.:ext）在 MVP 阶段仍保留，但不纳入本 OpenAPI 的首要范围。
servers:
  - url: http://127.0.0.1:3000

tags:
  - name: Random
  - name: Classification
  - name: Images
  - name: Health
  - name: Metrics
  - name: Admin

paths:
  /random:
    get:
      tags: [Random]
      summary: Random image (stream/json/redirect)
      description: |
        默认返回图片二进制（流式），并强制 `Cache-Control: no-store`。
        - `format=json`：返回 JSON
        - `redirect=1`：返回 302，Location 指向稳定图片 URL（/i/:id.:ext）
      parameters:
        - $ref: '#/components/parameters/RandomFormat'
        - $ref: '#/components/parameters/RandomRedirect'
        - $ref: '#/components/parameters/RandomAttempts'
        - $ref: '#/components/parameters/RandomSeed'
        - $ref: '#/components/parameters/FilterR18'
        - $ref: '#/components/parameters/FilterR18Strict'
        - $ref: '#/components/parameters/FilterOrientation'
        - $ref: '#/components/parameters/FilterMinWidth'
        - $ref: '#/components/parameters/FilterMinHeight'
        - $ref: '#/components/parameters/FilterMinPixels'
        - $ref: '#/components/parameters/FilterIncludedTags'
        - $ref: '#/components/parameters/FilterExcludedTags'
        - $ref: '#/components/parameters/FilterUserId'
        - $ref: '#/components/parameters/FilterIllustId'
      responses:
        '200':
          description: Image stream (default) or JSON (format=json)
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for /random
            Access-Control-Allow-Origin:
              schema: { type: string }
              description: Present for image stream responses (usually `*`)
            X-Origin-URL:
              schema: { type: string }
              description: Present for image stream responses
            X-Crawl-Date:
              schema: { type: string }
              description: Present for image stream responses
            X-Request-Id:
              schema: { type: string }
              description: Correlates logs/metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomJsonResponse'
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '302':
          description: Redirect to stable URL (/i/:id.:ext)
          headers:
            Location:
              schema: { type: string }
              description: Stable image URL
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for /random
            X-Request-Id:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/JsonBadRequest'
        '404':
          $ref: '#/components/responses/JsonNotFound'
        '429':
          description: Too Many Requests (rate limited)
          headers:
            Retry-After:
              schema: { type: string }
              description: Seconds to wait before retry
            RateLimit:
              schema: { type: string }
              description: Rate limit status (draft-7)
            X-Request-Id:
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
        '503':
          $ref: '#/components/responses/JsonServiceUnavailable'

  /tags:
    get:
      tags: [Classification]
      summary: Search tags with cursor pagination
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TagsLimit'
        - $ref: '#/components/parameters/TagsCursor'
      responses:
        '200':
          description: Tag search result
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for this endpoint
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '400':
          $ref: '#/components/responses/JsonBadRequest'
        '500':
          description: Internal Server Error
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /authors:
    get:
      tags: [Classification]
      summary: Search authors with cursor pagination
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/AuthorsLimit'
        - $ref: '#/components/parameters/AuthorsCursor'
      responses:
        '200':
          description: Author search result
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for this endpoint
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListResponse'
        '400':
          $ref: '#/components/responses/JsonBadRequest'
        '500':
          description: Internal Server Error
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /images:
    get:
      tags: [Classification]
      summary: List images with filters and cursor pagination
      parameters:
        - $ref: '#/components/parameters/ImagesLimit'
        - $ref: '#/components/parameters/ImagesCursor'
        - $ref: '#/components/parameters/FilterR18'
        - $ref: '#/components/parameters/FilterR18Strict'
        - $ref: '#/components/parameters/FilterOrientation'
        - $ref: '#/components/parameters/FilterMinWidth'
        - $ref: '#/components/parameters/FilterMinHeight'
        - $ref: '#/components/parameters/FilterMinPixels'
        - $ref: '#/components/parameters/FilterIncludedTags'
        - $ref: '#/components/parameters/FilterExcludedTags'
        - $ref: '#/components/parameters/FilterUserId'
        - $ref: '#/components/parameters/FilterIllustId'
      responses:
        '200':
          description: Image list result
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for this endpoint
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '400':
          $ref: '#/components/responses/JsonBadRequest'
        '500':
          description: Internal Server Error
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /images/{id}:
    get:
      tags: [Images]
      summary: Get one image record (JSON)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Image record
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for this endpoint
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageRecord'
        '400':
          $ref: '#/components/responses/JsonBadRequest'
        '404':
          $ref: '#/components/responses/JsonNotFound'
        '500':
          description: Internal Server Error
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /i/{id}.{ext}:
    get:
      tags: [Images]
      summary: Stable image proxy by DB id (stream)
      description: |
        从 DB 读取 original_url/ext 后进行流式代理。
        成功时使用长缓存（适合 CDN）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: ext
          in: path
          required: true
          schema:
            type: string
            enum: [jpg, jpeg, png, gif]
      responses:
        '200':
          description: Image stream
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `max-age=31536000, public`
            Access-Control-Allow-Origin:
              schema: { type: string }
              description: Always `*`
            X-Origin-URL:
              schema: { type: string }
            X-Crawl-Date:
              schema: { type: string }
            X-Request-Id:
              schema: { type: string }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '400':
          description: Bad Request (HTML error page)
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Not Found (HTML error page)
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            text/html:
              schema: { type: string }
        '502':
          description: Bad Gateway (HTML error page)
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            text/html:
              schema: { type: string }

  /healthz:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
        '503':
          description: Unhealthy
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'

  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus text format
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: Unauthorized (Basic auth)
          headers:
            WWW-Authenticate:
              schema: { type: string }
              description: Basic realm challenge
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    examples: [unauthorized]
        '404':
          description: Metrics disabled
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    examples: [metrics_disabled]
        '500':
          description: Internal Server Error
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin:
    get:
      tags: [Admin]
      summary: Admin UI (AdminJS)
      security:
        - AdminTokenAuth: []
      responses:
        '200':
          description: Admin UI HTML
          content:
            text/html:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/JsonUnauthorized'

  /admin/images/import:
    post:
      tags: [Admin]
      summary: Import Pixiv original image URLs (textarea/file)
      security:
        - AdminTokenAuth: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                urls:
                  type: string
                  description: 'URL list (one per line). Also accepts field names: text/textarea/input.'
                text:
                  type: string
                  description: Alias of `urls` (deprecated; kept for compatibility)
                file:
                  type: string
                  format: binary
                  description: Text file containing URL list
      responses:
        '200':
          description: Import result summary
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for admin APIs
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportResponse'
        '401':
          description: Unauthorized
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` for admin APIs
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal Server Error
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    AdminTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use: Authorization: Bearer <ADMIN_TOKEN>'

  responses:
    JsonBadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    JsonUnauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    JsonNotFound:
      description: Not Found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    JsonServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  parameters:
    RandomFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [image, json]
        default: image
      description: |
        输出格式：默认 `image`（返回图片流）。
        - `json`：返回 JSON
        非法值将返回 400（code=BAD_REQUEST, message=Invalid format.）。
      examples:
        image:
          value: image
        json:
          value: json
    RandomRedirect:
      name: redirect
      in: query
      required: false
      schema:
        type: integer
        enum: [0, 1]
        default: 0
      description: |
        是否返回 302 重定向到稳定图片 URL（`/i/:id.:ext`）。
        - `0`（默认）：不重定向
        - `1`：返回 302，响应头 `Location` 指向稳定图片 URL
        非法值将返回 400（code=BAD_REQUEST, message=Invalid redirect.）。
      examples:
        no_redirect:
          value: 0
        redirect:
          value: 1
    RandomAttempts:
      name: attempts
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 3
      description: |
        随机挑选失败时的重试次数。
        - 默认 `3`
        - 仅接受整数；非整数将返回 400（code=BAD_REQUEST, message=Invalid attempts.）
        - 超出范围会被夹到 `[1, 10]`（不会报错）
      examples:
        min:
          value: 1
        default:
          value: 3
        max:
          value: 10
    RandomSeed:
      name: seed
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: |
        伪随机种子。相同的 `seed` 会得到可复现的随机序列（便于调试/缓存）。
        - 省略：使用 `Math.random()`
        - 传入空字符串/纯空白：返回 400（code=BAD_REQUEST, message=Invalid seed.）
      examples:
        simple:
          value: demo
        date:
          value: 2026-02-02
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: 模糊检索关键字（为空时返回全量游标分页结果）。
      examples:
        author_name:
          value: alice
        tag_name:
          value: 猫
    TagsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: /tags 每页条数，默认 20，最大 100。
      examples:
        default:
          value: 20
        max:
          value: 100
    AuthorsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: /authors 每页条数，默认 20，最大 100。
      examples:
        default:
          value: 20
        max:
          value: 100
    ImagesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: /images 每页条数，默认 50，最大 200。
      examples:
        default:
          value: 50
        max:
          value: 200
    TagsCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        format: int64
      description: /tags 游标（上一页最后一条 tag.id）。
      examples:
        next_page:
          value: 1024
    AuthorsCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        format: int64
      description: /authors 游标（上一页最后一条 user_id）。
      examples:
        next_page:
          value: 998877
    ImagesCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        format: int64
      description: /images 游标（上一页最后一条 image.id）。
      examples:
        next_page:
          value: 778899

    FilterR18:
      name: r18
      in: query
      required: false
      schema:
        type: integer
        enum: [0, 1, 2]
        default: 0
      description: |
        Pixiv xRestrict 过滤：
        - `0`：全年龄（默认）
        - `1`：R18
        - `2`：R18G
        仅接受 `0/1/2`；空值或其他值返回 400（code=BAD_REQUEST, message=Invalid r18.）。
      examples:
        all_ages:
          value: 0
        r18:
          value: 1
        r18g:
          value: 2
    FilterR18Strict:
      name: r18_strict
      in: query
      required: false
      schema:
        type: integer
        enum: [0, 1]
      description: |
        当 `r18=0` 时是否严格排除 `xRestrict IS NULL` 的记录。
        - `1`：严格模式（仅保留 xRestrict=0）
        - `0`：允许 xRestrict 为空的历史数据
        未传时使用服务端默认配置。
      examples:
        strict:
          value: 1
        non_strict:
          value: 0
    FilterOrientation:
      name: orientation
      in: query
      required: false
      schema:
        type: string
        enum: [portrait, landscape, square, any]
        default: any
      description: |
        图片方向筛选：
        - `any`（默认）：不筛选
        - `portrait`：竖图
        - `landscape`：横图
        - `square`：正方形
        空值或其他值返回 400（code=BAD_REQUEST, message=Invalid orientation.）。
      examples:
        any:
          value: any
        portrait:
          value: portrait
        landscape:
          value: landscape
        square:
          value: square
    FilterMinWidth:
      name: min_width
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
      description: |
        最小宽度过滤（像素）。
        - 省略：不筛选
        - 仅接受非负整数；空值或非法值返回 400（code=BAD_REQUEST, message=Invalid min_width.）
      examples:
        none:
          value: 0
        hd:
          value: 1280
    FilterMinHeight:
      name: min_height
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
      description: |
        最小高度过滤（像素）。
        - 省略：不筛选
        - 仅接受非负整数；空值或非法值返回 400（code=BAD_REQUEST, message=Invalid min_height.）
      examples:
        none:
          value: 0
        hd:
          value: 720
    FilterMinPixels:
      name: min_pixels
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
      description: |
        最小像素数过滤：`width * height >= min_pixels`。
        - 省略：不筛选
        - 仅接受非负整数；空值或非法值返回 400（code=BAD_REQUEST, message=Invalid min_pixels.）
        - 需要图片已补全宽高元信息；否则可能被过滤掉
      examples:
        none:
          value: 0
        fullhd:
          value: 2073600
    FilterIncludedTags:
      name: included_tags
      in: query
      required: false
      schema:
        type: string
      description: |
        包含标签过滤（AND 语义）。
        - 传入格式：`tag1|tag2|tag3`（`|` 分隔；会 trim；重复会去重）
        - 语义：必须同时包含所有给定标签（AND）
        空值或解析后为空将返回 400（code=BAD_REQUEST, message=Invalid included_tags.）。
      examples:
        single:
          value: cat
        and_semantics:
          value: cat|dog
    FilterExcludedTags:
      name: excluded_tags
      in: query
      required: false
      schema:
        type: string
      description: |
        排除标签过滤（NOT 语义）。
        - 传入格式：`tag1|tag2|tag3`（`|` 分隔；会 trim；重复会去重）
        - 语义：只要命中任意一个排除标签就会被过滤掉（NOT / OR）
        空值或解析后为空将返回 400（code=BAD_REQUEST, message=Invalid excluded_tags.）。
      examples:
        single:
          value: r18
        not_semantics:
          value: r18|r18g
    FilterUserId:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: |
        Pixiv 用户 ID 过滤（精确匹配）。
        - 省略：不筛选
        - 仅接受正整数；空值或非法值返回 400（code=BAD_REQUEST, message=Invalid user_id.）
      examples:
        example:
          value: 12345678
    FilterIllustId:
      name: illust_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: |
        Pixiv 作品 ID 过滤（精确匹配）。
        - 省略：不筛选
        - 仅接受正整数；空值或非法值返回 400（code=BAD_REQUEST, message=Invalid illust_id.）
      examples:
        example:
          value: 123456789

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          examples: [NO_MATCH, UNSUPPORTED_URL, UPSTREAM_RATE_LIMIT]
        message:
          type: string
        request_id:
          type: string

    TagListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, translated_name, image_count]
            properties:
              id: { type: integer }
              name: { type: string }
              translated_name:
                type: string
                nullable: true
              image_count: { type: integer }
        next_cursor:
          type: string
          nullable: true

    AuthorListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [user_id, user_name, image_count]
            properties:
              user_id: { type: integer }
              user_name:
                type: string
                nullable: true
              image_count: { type: integer }
        next_cursor:
          type: string
          nullable: true

    ImageListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, illust_id, page_index, ext, width, height, x_restrict, user_id, user_name, status, tags]
            properties:
              id: { type: integer }
              illust_id: { type: integer }
              page_index: { type: integer, minimum: 0 }
              ext:
                type: string
                enum: [jpg, jpeg, png, gif]
              width: { type: integer, nullable: true }
              height: { type: integer, nullable: true }
              x_restrict:
                type: integer
                nullable: true
                description: 'Pixiv restriction: 0/1/2'
              user_id: { type: integer, nullable: true }
              user_name: { type: string, nullable: true }
              status:
                type: string
                enum: [active, disabled, broken]
              tags:
                type: array
                items: { type: string }
