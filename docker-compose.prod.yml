services:
  backend:
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Optional hardening: enable with BACKEND_READ_ONLY=true
    # When read-only, allow runtime temp writes via tmpfs mounts.
    read_only: ${BACKEND_READ_ONLY:-false}
    tmpfs:
      - /tmp
      - /app/.adminjs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + (process.env.PORT || 3000) + "/healthz").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    restart: unless-stopped
    ports: []

  memcached:
    restart: unless-stopped
    ports: []
