services:
  backend:
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Optional hardening: enable with BACKEND_READ_ONLY=true
    # When read-only, allow runtime temp writes via tmpfs mounts.
    read_only: ${BACKEND_READ_ONLY:-false}
    tmpfs:
      - /tmp
      - /app/.adminjs
    # Optional hardening: resource limits (tune per host).
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_LIMIT_CPUS:-1.0}"
          memory: "${BACKEND_LIMIT_MEMORY:-1024M}"
    ulimits:
      nofile:
        soft: ${BACKEND_ULIMIT_NOFILE_SOFT:-65535}
        hard: ${BACKEND_ULIMIT_NOFILE_HARD:-65535}
    # Optional hardening: cap Docker json-file logs (host-side rotation).
    logging:
      driver: json-file
      options:
        max-size: "${BACKEND_LOG_MAX_SIZE:-10m}"
        max-file: "${BACKEND_LOG_MAX_FILE:-3}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + (process.env.PORT || 3000) + "/healthz").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    restart: unless-stopped
    ports: []

  memcached:
    restart: unless-stopped
    ports: []
