services:
  backend:
    build:
      context: .
      target: runner
      args:
        APP_COMMIT: "${APP_COMMIT:-}"
        APP_BUILD_TIME: "${APP_BUILD_TIME:-}"
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "${HOST:-0.0.0.0}"
      PORT: "3000"
      # Optional build/runtime traceability (recommended): set these at deploy time.
      APP_COMMIT: "${APP_COMMIT:-}"
      APP_BUILD_TIME: "${APP_BUILD_TIME:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      REFRESH_TOKENS: '${REFRESH_TOKENS:-["please_set_refresh_token"]}'
      MEMCACHED_HOST: "${MEMCACHED_HOST:-memcached}"
      MEMCACHED_PORT: "${MEMCACHED_PORT:-11211}"
      MEMCACHED_NAMESPACE: "${MEMCACHED_NAMESPACE:-pixiv}"
      # Postgres connection. Prefer building DATABASE_URL at runtime (with URL-encoding)
      # to support special characters in POSTGRES_PASSWORD.
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-pixivcat}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pixivcat}"
      POSTGRES_DB: "${POSTGRES_DB:-pixivcat}"
      # Optional override: set DATABASE_URL directly if you want to fully control it.
      DATABASE_URL: "${DATABASE_URL:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      ADMIN_IP_ALLOWLIST: "${ADMIN_IP_ALLOWLIST:-}"
      ADMIN_SESSION_AUTH_ENABLED: "${ADMIN_SESSION_AUTH_ENABLED:-0}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
      ADMIN_SESSION_USER: "${ADMIN_SESSION_USER:-}"
      ADMIN_SESSION_PASS: "${ADMIN_SESSION_PASS:-}"
      ADMIN_CSRF_ENABLED: "${ADMIN_CSRF_ENABLED:-0}"
      ADMIN_CSRF_ALLOWED_ORIGINS: "${ADMIN_CSRF_ALLOWED_ORIGINS:-}"
      ADMIN_RATE_LIMIT_ENABLED: "${ADMIN_RATE_LIMIT_ENABLED:-0}"
      ADMIN_RATE_LIMIT_WINDOW_MS: "${ADMIN_RATE_LIMIT_WINDOW_MS:-}"
      ADMIN_RATE_LIMIT_MAX: "${ADMIN_RATE_LIMIT_MAX:-}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-0}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-}"
      RATE_LIMIT_MAX_API_KEY: "${RATE_LIMIT_MAX_API_KEY:-}"
      RATE_LIMIT_API_KEYS: "${RATE_LIMIT_API_KEYS:-}"
      METRICS_ENABLED: "${METRICS_ENABLED:-1}"
      METRICS_ROUTE: "${METRICS_ROUTE:-/metrics}"
      # AdminJS writes component bundles to ADMIN_JS_TMP_DIR (defaults to .adminjs).
      # Use /tmp so it stays writable even when BACKEND_READ_ONLY=true and avoids tmpfs permission issues.
      ADMIN_JS_TMP_DIR: "/tmp/.adminjs"
    # Optional hardening: enable with BACKEND_READ_ONLY=true
    # When read-only, allow runtime temp writes via tmpfs mounts.
    read_only: ${BACKEND_READ_ONLY:-false}
    tmpfs:
      - /tmp
      - /app/.adminjs
    # Optional hardening: resource limits (tune per host).
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_LIMIT_CPUS:-1.0}"
          memory: "${BACKEND_LIMIT_MEMORY:-1024M}"
    ulimits:
      nofile:
        soft: ${BACKEND_ULIMIT_NOFILE_SOFT:-65535}
        hard: ${BACKEND_ULIMIT_NOFILE_HARD:-65535}
    # Optional hardening: cap Docker json-file logs (host-side rotation).
    logging:
      driver: json-file
      options:
        max-size: "${BACKEND_LOG_MAX_SIZE:-10m}"
        max-file: "${BACKEND_LOG_MAX_FILE:-3}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + (process.env.PORT || 3000) + "/healthz").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrator
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-pixivcat}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pixivcat}"
      POSTGRES_DB: "${POSTGRES_DB:-pixivcat}"
      DATABASE_URL: "${DATABASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pixivcat}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pixivcat}"
      POSTGRES_DB: "${POSTGRES_DB:-pixivcat}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped

volumes:
  pgdata:
